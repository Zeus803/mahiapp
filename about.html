<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MAHIFIY</title>
<style>
  :root{--accent:#ff7a00;--accent2:#ffab4d;--accent-soft:rgba(255,122,0,.15);--bg:#0a0a0a;--panel:#151515;--panel2:#1f1f1f;--text:#f5f5f5;--muted:#9b9b9b;--line:#262626;--danger:#ff5252}
  :root[data-theme="light"]{--bg:#fff8f1;--panel:#ffffff;--panel2:#fff0e0;--text:#151515;--muted:#6b6b6b;--line:#ecdccb;--danger:#d93838}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button,input,select,textarea{font:inherit;color:inherit}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  select{width:auto;max-width:100%}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;min-height:40px;touch-action:manipulation}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#000;font-weight:700}
  .btn.icon{width:42px;height:42px;padding:0;border-radius:50%}
  .btn.danger{color:var(--danger)}
  .btn.on{color:var(--accent);border-color:var(--accent)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .muted{color:var(--muted);font-size:13px}
  .verified{color:var(--accent);font-weight:900}
  .badge{font-size:10px;background:var(--accent);color:#000;border-radius:6px;padding:2px 6px;margin-inline-start:6px;font-weight:700}
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}

  /* top bar */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{font-weight:900;font-size:20px;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-end:auto}
  .top .btn{padding:6px 12px;min-height:34px;font-size:13px}

  /* content */
  main{padding:12px 14px calc(230px + env(safe-area-inset-bottom))}
  h2{font-size:19px;margin:18px 0 10px}

  /* bottom nav */
  .bottom{position:fixed;bottom:0;left:0;right:0;z-index:12;display:flex;justify-content:space-around;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .navbtn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:11px;touch-action:manipulation}
  .navbtn .ic{font-size:19px;line-height:1}
  .navbtn.active{color:var(--accent)}
  .navbtn.active .ic{transform:scale(1.12)}

  /* cards & rows */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;flex-wrap:wrap}
  .row:active{background:var(--panel2)}
  .row.current{background:var(--accent-soft)}
  .row.current .title{color:var(--accent)}
  .cover{width:50px;height:50px;border-radius:10px;flex:0 0 50px;background-size:cover;background-position:center;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .play{cursor:pointer;min-width:0}
  .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
  .rowactions select{flex:1 1 140px;max-width:none}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .acard{text-align:center;cursor:pointer;margin:0;padding:14px 10px}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background-size:cover;background-position:center;border:3px solid var(--accent);box-shadow:0 6px 16px rgba(255,122,0,.25)}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
  .hero .avatar{margin:0;width:130px;height:130px}
  .hero .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .form{display:grid;gap:10px}
  .msg{border-inline-start:3px solid var(--accent);background:var(--panel2);padding:12px;border-radius:12px;margin:10px 0}
  .sec-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .empty{color:var(--muted);text-align:center;padding:28px 10px}
  .auth-card{margin:24px 0}

  /* mini player */
  .player{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:11;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .pTop{display:flex;align-items:center;gap:10px}
  .pTop .cover{width:44px;height:44px;flex-basis:44px;background:var(--panel2)}
  .pTop .info{flex:1;min-width:0}
  .pTop .title{font-size:14px}
  .pTop .btn.icon{width:40px;height:40px}
  .pTop .btn.primary.icon{width:46px;height:46px;font-size:17px}
  .pBar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .pBar span{font-size:11px;color:var(--muted);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
  input[type=range]{accent-color:var(--accent);padding:0;border:0;background:transparent;height:22px;cursor:pointer;width:100%}
  .pBar input{flex:1}
  .pExtra{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .pExtra .vol{display:flex;align-items:center;gap:8px;flex:1;max-width:180px}
  .pExtra .vol input{width:100%}

  .toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;display:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--accent);border-top-left-radius:22px;border-top-right-radius:22px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;display:grid;gap:10px;max-height:88vh;overflow:auto}
  .modal h2{margin:0 0 4px}
</style>
</head>
<body>

<header class="top">
  <div class="logo">MAHIFIY</div>
  <button class="btn" data-act="toggleLang" id="langBtn"></button>
  <button class="btn" data-act="toggleTheme" id="themeBtn"></button>
  <button class="btn" id="authBtn" hidden></button>
</header>

<main id="view"></main>

<nav class="bottom" id="nav"></nav>

<div class="player" id="player" hidden>
  <div class="pTop">
    <div class="cover" id="npCover"></div>
    <div class="info"><div class="title" id="npTitle">—</div><div class="muted" id="npArtist"></div></div>
    <button class="btn icon" data-act="prev" title="Previous">⏮</button>
    <button class="btn icon primary" data-act="pp" id="pp">▶</button>
    <button class="btn icon" data-act="next" title="Next">⏭</button>
  </div>
  <div class="pBar">
    <span id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <span id="tDur">0:00</span>
  </div>
  <div class="pExtra">
    <button class="btn" data-act="shuffle" id="shBtn">🔀</button>
    <div class="vol"><span class="muted">🔊</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></div>
    <button class="btn" data-act="repeat" id="rpBtn">🔁</button>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>

let prefs={lang:'fa',theme:'dark'};
try{ Object.assign(prefs,JSON.parse(localStorage.getItem(PKEY))||{}); }catch(e){}
if(!['fa','en'].includes(prefs.lang)) prefs.lang='fa';
const t=k=>(T[prefs.lang][k]??T.fa[k]??k);

function load(){
  const base={users:[],tracks:[],artists:{},hidden:{},suggested:[],tickets:[]};
  try{ const d=JSON.parse(localStorage.getItem(KEY)); return d&&typeof d==='object'?{...base,...d}:base; }
  catch(e){ return base; }
}
let db=load();
let session=localStorage.getItem(SKEY);
let view='home', viewArtist=null, q='', ctx=[], queue=[], qi=-1, shuffle=false, repeatMode=0;

const $=s=>document.querySelector(s);
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const grad=s=>`linear-gradient(135deg,hsl(${hue(s)},75%,50%),#111)`;
const safeUrl=u=>{ u=String(u||'').trim(); return /^https?:\/\/\S+$/i.test(u)?u:''; };
function coverStyle(src,seed){
  const u=safeUrl(src);
  if(!u) return `background:${grad(seed||'')}`;
  return `background-image:url("${u.replace(/"/g,'%22')}")`;
}
const fmt=n=>{ if(!isFinite(n)) return '0:00'; const m=Math.floor(n/60), s=Math.floor(n%60); return m+':'+String(s).padStart(2,'0'); };
const val=id=>(document.getElementById(id)?.value??'').trim();
const rawVal=id=>document.getElementById(id)?.value??'';
function persist(){ localStorage.setItem(KEY,JSON.stringify(db)); localStorage.setItem(PKEY,JSON.stringify(prefs)); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2200); }
function openModal(html){ $('#modalBody').innerHTML=`<div data-scope>${html}</div>`; $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }

async function hashPass(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:200000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeUser(name,username,pw,role){
  const salt=uid()+uid();
  return {id:uid(),name,username,role,salt,hash:await hashPass(pw,salt),playlists:[]};
}
const me=()=>db.users.find(u=>u.id===session)||null;
const role=()=>me()?.role||'';
const isOwner=()=>role()==='owner';
const canManage=()=>['owner','admin'].includes(role());
const canUpload=()=>['owner','admin','artist'].includes(role());
const visible=s=>isOwner()||!db.hidden[s];
const approved=()=>db.tracks.filter(x=>x.status==='approved');
const byId=id=>db.tracks.find(x=>x.id===id);
const artistInfo=n=>has(db.artists,n)?db.artists[n]:{};
const ensureArtist=n=>{ if(!has(db.artists,n)) db.artists[n]={bio:'',avatar:'',verified:false}; return db.artists[n]; };
const artistNames=()=>[...new Set([...Object.keys(db.artists),...approved().map(x=>x.artist)])].sort((a,b)=>a.localeCompare(b));

function checkNew(name,username,pw){
  if(!name) return t('needName');
  if(!/^[a-z0-9_.]{3,20}$/.test(username)) return t('badUsername');
  if(pw.length<8) return t('minPass');
  if(db.users.some(x=>x.username===username)) return t('takenUser');
  return '';
}

async function doSetup(){
  if(db.users.some(u=>u.role==='owner')) return;
  const name=val('sn'), user=val('su').toLowerCase(), pw=rawVal('sp');
  const err=checkNew(name,user,pw); if(err) return toast(err);
  const acc=await makeUser(name,user,pw,'owner');
  db.users.push(acc); session=acc.id; localStorage.setItem(SKEY,session);
  persist(); toast(t('saved')); view='home'; render();
}
function loginModal(){
  openModal(`<h2>${t('login')}</h2>
    <input id="lu" placeholder="${t('username')}" dir="ltr" autocomplete="username">
    <input id="lp" type="password" placeholder="${t('password')}" dir="ltr" autocomplete="current-password">
    <button class="btn primary" data-act="login" data-primary>${t('login')}</button>
    <button class="btn" data-act="registerModal">${t('register')}</button>`);
}
async function doLogin(){
  const user=val('lu').toLowerCase(), pw=rawVal('lp');
  const acc=db.users.find(x=>x.username===user);
  if(!acc||(await hashPass(pw,acc.salt))!==acc.hash) return toast(t('badLogin'));
  session=acc.id; localStorage.setItem(SKEY,session); closeModal(); view='home'; render();
}
function registerModal(){
  openModal(`<h2>${t('register')}</h2>
    <input id="rn" placeholder="${t('name')}">
    <input id="ru" placeholder="${t('username')}" dir="ltr" autocomplete="username">
    <input id="rp" type="password" placeholder="${t('password')}" dir="ltr" autocomplete="new-password">
    <select id="rr"><option value="user">${t('role_user')}</option><option value="artist">${t('role_artist')}</option></select>
    <button class="btn primary" data-act="register" data-primary>${t('register')}</button>`);
}
async function doRegister(){
  const name=val('rn'), user=val('ru').toLowerCase(), pw=rawVal('rp'), r=val('rr')==='artist'?'artist':'user';
  const err=checkNew(name,user,pw); if(err) return toast(err);
  const acc=await makeUser(name,user,pw,r);
  db.users.push(acc); session=acc.id; localStorage.setItem(SKEY,session);
  persist(); closeModal(); view='home'; render();
}
function logout(){ session=null; localStorage.removeItem(SKEY); view='home'; closeModal(); render(); }

const audio=new Audio();
audio.volume=0.8;
function markCurrent(){
  const cur=queue[qi];
  document.querySelectorAll('[data-row]').forEach(r=>r.classList.toggle('current',!!audio.src&&r.dataset.row===cur));
}
function loadCurrent(autoplay){
  const tr=byId(queue[qi]); if(!tr) return;
  const src=safeUrl(tr.url);
  if(!src){ toast(t('noAudio')); return; }
  audio.src=src;
  $('#player').hidden=false;
  $('#npTitle').textContent=tr.title;
  $('#npArtist').textContent=tr.artist;
  $('#npCover').style.cssText=coverStyle(tr.cover||artistInfo(tr.artist).avatar,tr.title);
  $('#seek').value=0; $('#tCur').textContent='0:00'; $('#tDur').textContent='0:00';
  if(autoplay) audio.play().catch(()=>toast(t('playErr')));
  markCurrent();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:tr.title,artist:tr.artist});
    navigator.mediaSession.setActionHandler('nexttrack',next);
    navigator.mediaSession.setActionHandler('previoustrack',prev);
    navigator.mediaSession.setActionHandler('play',()=>audio.play());
    navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  }
}
function playList(ids){
  if(!ids.length) return toast(t('emptyList'));
  queue=ids; qi=0; loadCurrent(true);
}
function playFromId(id){
  const tr=byId(id); if(!tr) return;
  if(tr.status!=='approved') return toast(t('notApproved'));
  const list=ctx.includes(id)?ctx:[id];
  queue=list; qi=list.indexOf(id); loadCurrent(true);
}
function togglePlay(){
  if(!audio.src){ if(queue.length) loadCurrent(true); else toast(t('emptyList')); return; }
  if(audio.paused) audio.play().catch(()=>toast(t('playErr'))); else audio.pause();
}
function next(){
  if(!queue.length) return;
  if(repeatMode===2){ audio.currentTime=0; audio.play(); return; }
  if(shuffle&&queue.length>1){ let n; do{ n=Math.floor(Math.random()*queue.length); }while(n===qi); qi=n; }
  else if(qi+1<queue.length) qi++;
  else if(repeatMode===1) qi=0;
  else { audio.pause(); audio.currentTime=0; return; }
  loadCurrent(true);
}
function prev(){
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  if(!queue.length) return;
  qi=(qi-1+queue.length)%queue.length; loadCurrent(true);
}
function toggleShuffle(){ shuffle=!shuffle; $('#shBtn').classList.toggle('on',shuffle); toast(shuffle?t('shuffleOn'):t('shuffleOff')); }
function toggleRepeat(){
  repeatMode=(repeatMode+1)%3;
  $('#rpBtn').classList.toggle('on',repeatMode>0);
  $('#rpBtn').textContent=repeatMode===2?'🔂':'🔁';
  toast([t('repeatOff'),t('repeatAll'),t('repeatOne')][repeatMode]);
}
audio.onplay=()=>{ $('#pp').textContent='⏸'; };
audio.onpause=()=>{ $('#pp').textContent='▶'; };
audio.onended=next;
audio.onerror=()=>{ if(audio.src) toast(t('playErr')); };
audio.onloadedmetadata=()=>{ $('#tDur').textContent=fmt(audio.duration); };
audio.ontimeupdate=()=>{
  if(!audio.duration) return;
  $('#seek').value=audio.currentTime/audio.duration*100;
  $('#tCur').textContent=fmt(audio.currentTime);
};

  if(!isOwner()) return;
  const u=db.users.find(x=>x.id===id); if(!u) return;
  const p=prompt(t('newPass')); if(!p) return;
  if(p.length<8) return toast(t('minPass'));
  u.salt=uid()+uid(); u.hash=await hashPass(p,u.salt);
  persist(); toast(t('saved'));
}
function delUser(id){
  if(!isOwner()) return;
  const u=db.users.find(x=>x.id===id); if(!u) return;
  if(u.role==='owner') return toast(t('ownerLocked'));
  if(!confirm(t('sure'))) return;
  db.users=db.users.filter(x=>x.id!==id);
  if(session===id) logout(); else { persist(); render(); }
}
function toggleSection(el){
  if(!isOwner()) return;
  const s=el.dataset.name; db.hidden[s]=!db.hidden[s];
  persist(); render();
}
function toggleLang(){ prefs.lang=prefs.lang==='fa'?'en':'fa'; persist(); render(); }
function toggleTheme(){ prefs.theme=prefs.theme==='dark'?'light':'dark'; persist(); render(); }

const A={
  go:el=>{ view=el.dataset.view; viewArtist=null; render(); window.scrollTo(0,0); },
  openArtist:el=>{ viewArtist=el.dataset.name; view='artist'; render(); window.scrollTo(0,0); },
  play:el=>playFromId(el.dataset.id),
  playAll:el=>playList(approved().filter(x=>x.artist===el.dataset.name).map(x=>x.id)),
  playPl:el=>{ const pl=me()?.playlists.find(p=>p.id===el.dataset.id); if(pl) playList(pl.tracks.filter(id=>byId(id)?.status==='approved')); },
  pp:togglePlay, next, prev, shuffle:toggleShuffle, repeat:toggleRepeat,
  setup:doSetup, login:doLogin, register:doRegister, loginModal, registerModal, logout, closeModal,
  approve:el=>setStatus(el.dataset.id,'approved'),
  reject:el=>setStatus(el.dataset.id,'rejected'),
  editTrack:el=>editTrackModal(el.dataset.id),
  saveTrack:el=>doSaveTrack(el.dataset.id),
  delTrack:el=>delTrack(el.dataset.id),
  editArtist:el=>editArtistModal(el.dataset.name),
  saveArtist:el=>doSaveArtist(el.dataset.name),
  addArtist, toggleVerify:el=>toggleVerify(el.dataset.name),
  submitUpload, newPlaylist, delPlaylist:el=>delPlaylist(el.dataset.id), removeFromPl,
  addSuggested, delSuggested:el=>delSuggested(el.dataset.id),
  sendTicket, reply:el=>replyTicket(el.dataset.id),
  renameUser:el=>renameUser(el.dataset.id), resetPass:el=>resetPass(el.dataset.id), delUser:el=>delUser(el.dataset.id),
  toggleSection, toggleLang, toggleTheme,
  addToPl, suggestAdd, changeRole
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='SELECT'||el.tagName==='INPUT') return;
  const fn=A[el.dataset.act]; if(fn) fn(el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.tagName!=='SELECT'||!el.dataset.act) return;
  const fn=A[el.dataset.act]; if(fn) fn(el);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){ q=el.value; renderResults(); }
  else if(el.id==='seek'){ if(audio.duration) audio.currentTime=audio.duration*el.value/100; }
  else if(el.id==='vol'){ audio.volume=+el.value; }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&e.target.tagName==='INPUT') e.target.closest('[data-scope]')?.querySelector('[data-primary]')?.click();
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

render();
</script>
</body>
</html>
